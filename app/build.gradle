plugins {
    id 'com.android.application'
}

android {
    namespace 'com.openpipe.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.openpipe.app'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            // Shrink code + resources so the APK stays tiny.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Signed with the debug key so the APK installs straight away.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// No dependencies on purpose: pure Android framework = smallest possible APK.
